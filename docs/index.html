<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전남광주교육지도</title>
<meta name="description" content="전라남도·광주광역시 초·중·고·특수학교의 위치와 통학구역을 지도에서 확인하고, 학교 정보와 읍면동별 거리를 살펴보는 교사용 교육 지도">
<meta property="og:title" content="전남광주교육지도">
<meta property="og:description" content="우리 지역 학교 위치와 초등 통학구역·중학구, 가까운 학교까지의 거리를 지도에서 살펴보세요.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F2F7F8">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://api.vworld.kr" crossorigin>
<link rel="preconnect" href="https://s3.amazonaws.com" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" as="script">
<link rel="preload" href="data/stats.json" as="fetch" crossorigin>
<link rel="preload" href="data/schools.json" as="fetch" crossorigin>
<link rel="preload" href="data/sigun.geojson" as="fetch" crossorigin>
<link rel="preload" href="data/mask.geojson" as="fetch" crossorigin>
<link rel="preload" href="data/closed.json" as="fetch" crossorigin>
<link rel="preload" href="data/emd.geojson" as="fetch" crossorigin>
<link rel="preload" href="data/zones_e.geojson" as="fetch" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{
  --pt:#315B75; --pt-h:#25465C; --pt-soft:#E9F0F4; --pt-line:#C4D6E0;
  --bg:#F2F7F8; --card:#FFFFFF; --line:#DFE8EA; --line-2:#C9D8DC;
  --tx:#1F2A24; --tx-2:#5A635C; --tx-3:#6F766F;
  --warn:#B26B0F; --bad:#C0392B;
  --k-e:#2E8B57; --k-m:#2F6DB5; --k-h:#9C2F6E; --k-s:#1A9AA8;
  --r1:8px; --r2:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06); --float:0 6px 24px rgba(31,42,36,.14);
  --top:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- 상단 ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:20px;padding:0 16px 0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:0}
.brand svg{flex:none}
.kpis{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.school-home #kpis{display:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{padding:0 16px;border-left:1px solid var(--line);white-space:nowrap;display:flex;flex-direction:column;justify-content:center;background:none;border-top:0;border-bottom:0;border-right:0;text-align:left}
.kpi:first-child{border-left:0}
.kpi b{font-size:16px;font-weight:700}
.kpi small{font-size:12px;color:var(--tx-2);font-weight:500}
.kpi em{font-style:normal;font-size:11.5px;font-weight:600;margin-left:4px;color:var(--bad)}
.kpi.btn:hover b{color:var(--pt)}
.top-r{display:flex;gap:8px;align-items:center;white-space:nowrap}
.ref{font-size:12px;color:var(--tx-3)}
.tbtn{height:34px;padding:0 12px;border-radius:var(--r1);border:1px solid var(--line-2);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--pt);color:var(--pt)}
.tbtn.pri{background:var(--pt);color:#fff;border-color:var(--pt)}
.tbtn.pri:hover{background:var(--pt-h);color:#fff}

/* ---------- 왼쪽 패널 ---------- */
.panel{position:fixed;top:var(--top);left:0;bottom:0;width:408px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.ptabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);flex:none}
.ptab{border:0;background:none;padding:9px 12px 11px;font-size:14.5px;font-weight:600;color:var(--tx-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab[aria-selected=true]{color:var(--pt);border-bottom-color:var(--pt)}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 40px}
.sheet-handle{display:none}
.sec-l{font-size:12.5px;font-weight:600;color:var(--tx-2);letter-spacing:.02em;margin:22px 0 8px}
.sec-l:first-child{margin-top:0}
.muted{color:var(--tx-2)}
.small{font-size:13px}
.back{border:0;background:none;padding:0;color:var(--pt);font-size:13.5px;font-weight:600;margin-bottom:14px}
.back:hover{text-decoration:underline}

/* 질문 목록 */
.intro{margin:-18px -20px 16px;position:relative;height:150px;overflow:hidden;border-bottom:1px solid var(--line);background:#EEEBE3}
.intro img{width:100%;height:100%;object-fit:cover;display:block}
.intro p{position:absolute;left:18px;bottom:12px;right:18px;margin:0;font-size:13px;line-height:1.5;color:var(--tx);background:rgba(255,255,255,.86);padding:8px 10px;border-radius:var(--r1)}
.qgroup{font-size:12.5px;font-weight:600;color:var(--tx-2);margin:20px 0 4px}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-bottom:1px solid var(--line)}
.qrow:hover .qt{color:var(--pt)}
.qn{flex:none;width:22px;height:22px;border-radius:6px;background:var(--pt-soft);color:var(--pt);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.qt{font-size:15px;font-weight:600;line-height:1.45}
.qs{font-size:12.5px;color:var(--tx-2);margin-top:3px;line-height:1.45}

/* 질문 상세 */
.cat{font-size:12.5px;font-weight:600;color:#8A4B1E;margin-bottom:6px}
h2.q{font-size:21px;line-height:1.4;margin:0 0 16px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--pt)}
.chip[aria-pressed=true]{background:var(--pt-soft);border-color:var(--pt-line);color:var(--pt);font-weight:600}
.hero{margin:16px 0 12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r2);background:#FAF9F6}
.hero .l{font-size:12.5px;color:var(--tx-2)}
.hero .v{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.hero .v small{font-size:13px;color:var(--tx-2);font-weight:500;margin-left:3px}
.hero .d{font-size:12px;color:var(--tx-3)}
.story p{font-size:14.5px;line-height:1.7;margin:0 0 10px}
.story p b{font-weight:700}
.note{font-size:12.5px;line-height:1.6;color:var(--tx-2);background:#FAF9F6;border-left:3px solid var(--line-2);padding:8px 10px;margin:12px 0}

/* 순위 막대 */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:18px 1fr 64px;align-items:center;gap:8px;padding:6px 2px;font-size:13.5px;border-radius:6px;cursor:pointer}
.rank li:hover{background:#F6F4EF}
.rank li.on{background:var(--pt-soft)}
.rank .sw{width:10px;height:10px;border-radius:3px}
.rank .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.rank .bar{height:5px;border-radius:0 3px 3px 0;background:#CFC9BB;min-width:2px}
.rank .v{text-align:right;font-weight:600}
.rank .tag{font-size:12px;color:#8A4B1E;font-weight:600;margin-left:4px}

/* 검색 */
.search{position:relative}
.search input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:var(--r1);padding:0 14px 0 40px;font-size:15px;background:var(--card)}
.search input:focus{border-color:var(--pt);box-shadow:0 0 0 3px rgba(49,91,117,.14);outline:0}
.search svg{position:absolute;left:13px;top:14px;color:var(--tx-3)}
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
select.sel{height:34px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--card);padding:0 8px;font-size:13px}
.slist{list-style:none;margin:10px 0 0;padding:0}
.slist li{border-bottom:1px solid var(--line)}
.slist button{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:11px 2px;text-align:left}
.slist button:hover .sn{color:var(--pt)}
.dot{width:10px;height:10px;border-radius:50%}
.sn{font-size:14.5px;font-weight:600}
.sm{font-size:12px;color:var(--tx-2);margin-top:2px}
.sv{font-size:13px;font-weight:600;text-align:right}
.sv small{display:block;font-weight:500;color:var(--tx-3);font-size:11.5px}
.more{width:100%;margin-top:10px}
.count{font-size:12.5px;color:var(--tx-2);margin-top:12px}

/* 학교 카드 */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:#F1EFE9;color:var(--tx-2);font-weight:500}
.tag.bj{background:#FBF0DE;color:#8A4B1E;font-weight:600}
.tag.k{color:#fff;font-weight:600}
h2.sch{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.sub{font-size:13px;color:var(--tx-2);margin-top:4px}
.grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r2);margin-top:16px;overflow:hidden}
.grid5>div{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid5>div:nth-child(3n){border-right:0}
.grid5>div:nth-last-child(-n+3){border-bottom:0}
.grid5 .l{font-size:12px;color:var(--tx-2)}
.grid5 .v{font-size:19px;font-weight:700;margin-top:2px}
.grid5 .v small{font-size:12px;color:var(--tx-2);font-weight:500;margin-left:2px}
.cmp{display:grid;grid-template-columns:92px 1fr 56px;gap:10px;align-items:center;font-size:13px;padding:7px 0}
.cmp .track{position:relative;height:18px}
.cmp .track::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:#E7E3DA;border-radius:2px}
.cmp .mid{position:absolute;top:2px;width:2px;height:14px;background:var(--tx-3)}
.cmp .me{position:absolute;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pt);border:2px solid #fff;box-shadow:0 0 0 1px var(--pt);transform:translateX(-5px)}
.cmp .v{text-align:right;font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px;line-height:1.5}
.kv dt{color:var(--tx-2)}
.kv dd{margin:0}
.kv a{color:var(--pt)}
.meal{font-size:13.5px;line-height:1.7;margin:0}
.evs{list-style:none;margin:0;padding:0;font-size:13.5px}
.evs li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.evs li span:first-child{color:var(--tx-2);width:74px;flex:none}
.skel{color:var(--tx-3);font-size:13px}
svg.chart text{font-family:inherit}

/* 시군 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--tx-2);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line-2)}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child{text-align:left;font-weight:600}
.tbl tr{cursor:pointer}
.tbl tr:hover td{background:#F6F4EF}

/* ---------- 지도 ---------- */
#map{position:fixed;top:var(--top);left:408px;right:0;bottom:0;background:#EEF1EE}
.ctl-ind{position:fixed;top:calc(var(--top) + 12px);left:420px;right:250px;z-index:7;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ctl-ind>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--tx-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--tx);color:#fff;font-weight:600}
.seg.kinds button[aria-pressed=true]{background:var(--pt)}
.seg.dim button{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inddd{position:relative}
.inddd>button{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--card);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.inddd .menu{position:absolute;top:42px;left:0;width:320px;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r2);box-shadow:var(--float);padding:8px;display:none}
.inddd.open .menu{display:block;z-index:30}
body.menu-open .legend{visibility:hidden}
.menu h4{font-size:11.5px;color:var(--tx-3);font-weight:600;margin:8px 8px 4px;letter-spacing:.02em}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:#F4F2EC}
.menu button[aria-pressed=true]{background:var(--pt-soft);color:var(--pt);font-weight:600}
.menu button small{display:block;color:var(--tx-3);font-size:12px;margin-top:1px}

.ctl-r{position:fixed;top:calc(var(--top) + 12px);right:12px;z-index:5;width:226px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r2);box-shadow:var(--shadow);padding:10px}
.ctl-r h4{font-size:11.5px;color:var(--tx-3);font-weight:600;margin:10px 4px 4px;letter-spacing:.02em}
.ctl-r h4:first-child{margin-top:2px}
.tg{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 6px;border-radius:7px;font-size:13.5px;text-align:left}
.tg:hover{background:#F4F2EC}
.tg .bx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center}
.tg[aria-pressed=true] .bx{background:var(--pt);border-color:var(--pt)}
.tg[aria-pressed=true] .bx::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:#F1EFE9;border-radius:9px;padding:3px}
.three button{border:0;background:none;padding:7px 0;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--tx-2)}
.three button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.row2 .tbtn{margin-top:0;padding:0 6px;font-size:12.5px}
.tg small{font-weight:400;font-size:11.5px}
.readme{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 102px);z-index:4;background:rgba(255,255,255,.94);border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:var(--shadow);max-width:min(620px,calc(100vw - 700px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.readme b{color:var(--pt)}
.glance{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:6px}
.glance h3{margin:0;padding:14px 16px 4px;font-size:16px;letter-spacing:-.01em}
.glance .why{padding:0 16px 12px;font-size:13px;line-height:1.6;color:var(--tx-2);margin:0}
.gl-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.gl-grid button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);text-align:left;padding:12px 14px;min-height:96px}
.gl-grid button:nth-child(2n){border-right:0}.gl-grid button:nth-last-child(-n+2){border-bottom:0}
.gl-grid button:hover{background:#F7F5F0}
.gl-grid b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#8A3E14}
.gl-grid b.g{color:var(--pt)}
.gl-grid span{display:block;font-size:12.5px;line-height:1.45;color:var(--tx);margin-top:3px}
.gl-grid em{display:block;font-style:normal;font-size:12px;color:var(--pt);margin-top:5px;font-weight:600}
.zone-box{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--pt-line);background:var(--pt-soft);border-radius:var(--r1);padding:9px 12px;font-size:13.5px;margin-top:12px}
.zone-box b{font-weight:700}
.map-start{padding:14px 14px 12px;margin:4px 12px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--card),var(--pt-soft))}
.map-start h2{font-size:18px;letter-spacing:-.03em;margin:0 0 5px}
.map-start p{font-size:13px;line-height:1.5;color:var(--tx-2);margin:0}
.map-start{position:relative;isolation:isolate;overflow:hidden;padding:17px 16px 14px;border:1px solid rgba(31,91,113,.5);background:radial-gradient(circle at 100% 0%,rgba(72,215,199,.28),transparent 42%),linear-gradient(132deg,#102D48 0%,#14566B 58%,#147F7A 100%);box-shadow:0 10px 28px rgba(16,57,77,.2);color:#F5FCFF}
.map-start::after{content:"";position:absolute;z-index:-1;right:-42px;top:-70px;width:190px;height:190px;border:1px solid rgba(187,247,244,.2);border-radius:50%;box-shadow:0 0 0 18px rgba(187,247,244,.045),0 0 0 40px rgba(187,247,244,.035)}
.map-start-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.map-start-kicker{font-size:10px;letter-spacing:.13em;font-weight:800;color:#A8E8E2}
.map-start-count{font-size:10.5px;letter-spacing:.06em;color:#DAF8F4;border:1px solid rgba(210,250,246,.35);border-radius:999px;padding:3px 8px}
.map-start h2{font-size:19px;color:#fff;line-height:1.3;margin:0 0 6px}
.map-start>p:not(.map-note){color:rgba(239,250,252,.8)}
.map-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}
.map-counts>div{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:7px 3px;text-align:center;color:var(--tx)}
.map-counts b{display:block;font-size:16px}.map-counts span{display:block;font-size:10.5px;color:var(--tx-2);margin-top:2px}
.map-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.map-actions button{min-height:38px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);font-size:12px;font-weight:600;color:var(--tx)}
.map-actions button:hover{border-color:var(--pt);color:var(--pt)}
.map-actions button:last-child{grid-column:1 / -1}
.map-start .map-note{font-size:11.5px;color:var(--tx-3);margin-top:8px}
.map-start .map-note{color:rgba(231,247,248,.66)}
.map-start .map-counts>div{background:rgba(7,22,32,.44);border-color:rgba(204,241,244,.2);color:#fff}
.map-start .map-counts span{color:rgba(231,247,248,.72)}
.map-start .map-actions button{background:rgba(8,27,37,.74);border-color:rgba(204,241,244,.24);color:#E8FAFA}
.map-start .map-actions button:hover{background:#E8FAFA;border-color:#E8FAFA;color:#143E55}
.zone-help{padding:8px 9px;margin:4px 2px 8px;border-radius:8px;background:var(--pt-soft);font-size:11.5px;line-height:1.5;color:var(--tx-2)}
.tl-bar.pred i{background:repeating-linear-gradient(135deg,#D8D3C6 0 4px,#EFEBE2 4px 8px)}
.tl-bar.pred[aria-pressed=true] i{background:repeating-linear-gradient(135deg,#23704A 0 4px,#5E9C7C 4px 8px)}
.tl-bar.pred span::after{content:" 추정";font-size:10.5px;color:var(--tx-3)}
.fc{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-top:4px;background:#FCFBF8}
.fc p{margin:6px 0 0;font-size:14px;line-height:1.6}
.fc .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.fc .warn{color:#8A3E14;font-weight:700}
.simbtn{width:100%;height:46px;margin-top:12px;border-radius:var(--r1);border:1px solid #8A3E14;background:#FFF7F1;color:#8A3E14;font-weight:700;font-size:14.5px}
.simbtn:hover{background:#8A3E14;color:#fff}
.sim{border:2px solid #8A3E14;border-radius:var(--r2);padding:14px;margin-top:12px;background:#FFFCF9}
.sim h4{margin:0 0 8px;font-size:15px;color:#8A3E14}
.sim .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sim .row3 div{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.sim .row3 b{display:block;font-size:18px}
.sim .row3 small{font-size:11.5px;color:var(--tx-2)}
.sim-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx-2);margin-top:6px}
.sim-leg i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#2E8B57,#E3AE80,#B03A1A)}
.simbar{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:8;background:#8A3E14;color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;box-shadow:var(--float);display:none;align-items:center;gap:12px}
.simbar.on{display:flex}
.simbar button{border:0;background:#fff;color:#8A3E14;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px}
.ctl-r .tbtn{width:100%;justify-content:center;margin-top:8px}
.kleg{display:flex;flex-wrap:wrap;gap:4px 10px;padding:2px 6px 4px;font-size:12px;color:var(--tx-2)}
.kleg span{display:inline-flex;align-items:center;gap:5px}
.kleg i{width:9px;height:9px;border-radius:50%;display:inline-block}

.legend{position:fixed;left:420px;bottom:94px;z-index:5;background:rgba(255,255,255,.95);border:1px solid var(--line-2);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--shadow);width:310px}
.legend .t{font-size:12.5px;font-weight:600;margin-bottom:6px}
.legend .t small{font-weight:500;color:var(--tx-3);margin-left:4px}
.lg-bar{display:flex;gap:2px}
.lg-bar i{flex:1;height:10px}
.lg-bar i:first-child{border-radius:3px 0 0 3px}.lg-bar i:last-child{border-radius:0 3px 3px 0}
.lg-lab{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:12px;color:var(--tx-2);margin-top:4px}
.lg-lab span{white-space:nowrap;overflow:hidden;text-overflow:clip}
.lg-rng{font-size:12px;color:var(--tx-2);margin-top:3px}
.legend .mean{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin:2px 0 7px;color:var(--tx)}
.legend .mean i{width:14px;height:14px;border-radius:4px;flex:none}
.lg-cat{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.lg-cat span{display:flex;align-items:center;gap:7px}
.lg-cat i{width:12px;height:12px;border-radius:3px}
.legend .foot{font-size:12px;color:var(--tx-3);margin-top:6px;line-height:1.4}

.timeline{position:fixed;left:420px;right:12px;bottom:12px;z-index:5;height:70px;background:rgba(255,255,255,.96);border:1px solid var(--line-2);border-radius:var(--r2);box-shadow:var(--shadow);display:flex;align-items:stretch;gap:12px;padding:10px 14px}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);align-self:center;display:grid;place-items:center;flex:none}
.play:hover{border-color:var(--pt);color:var(--pt)}
.tl-info{width:190px;flex:none;display:flex;flex-direction:column;justify-content:center}
.tl-info .a{font-size:12px;color:var(--tx-2)}
.tl-info .b{font-size:17px;font-weight:700;margin-top:2px}
.tl-info .c{font-size:12px;color:var(--tx-3);margin-top:1px}
.tl-bars{flex:1;display:flex;align-items:flex-end;gap:8px;min-width:0}
.tl-bar{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;padding:0;gap:4px}
.tl-bar i{display:block;max-height:22px;background:#D8D3C6;border-radius:4px 4px 0 0;transition:height .35s ease,background .2s}
.tl-bar span{font-size:12px;color:var(--tx-2);text-align:center}
.tl-bar b{font-size:12px;font-weight:600;color:var(--tx-2);text-align:center}
.tl-bar[aria-pressed=true] i{background:var(--pt)}
.tl-bar[aria-pressed=true] span{color:var(--tx);font-weight:700}
.tl-bar:disabled{cursor:default}
.tl-bar:disabled i{background:#ECE9E1}
.tl-bar.lock{opacity:.45}
.skip{position:absolute;left:-999px;top:8px;z-index:60;background:var(--pt);color:#fff;padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}
.empty{font-size:13.5px;color:var(--tx-2);line-height:1.6;margin:14px 0 8px}
.rank li:focus-visible{outline:2px solid var(--pt);outline-offset:1px}

.tip{position:fixed;z-index:30;pointer-events:none;background:rgba(24,30,26,.94);color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;max-width:260px;display:none;box-shadow:var(--float)}
.tip b{font-size:13.5px}
.tip .dim{color:#BFC7C0}

.lbl{pointer-events:none;transition:opacity .15s linear;text-align:center;font-weight:700;font-size:12.5px;color:var(--tx);line-height:1.25;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.lbl span{display:block;font-size:12px;font-weight:600;color:#3A3F3B}
body.sat .lbl.box{background:rgba(12,16,20,.62);border-color:rgba(255,255,255,.25);color:#fff}
body.sat .lbl.box span{color:#E6ECF0}
body.sat .lbl{color:#fff;text-shadow:0 0 4px #000,0 0 8px #000}
.lbl.box{background:rgba(255,255,255,.9);border:1px solid var(--line-2);border-radius:6px;padding:2px 6px;text-shadow:none}
.lbl.hide-v span{display:none}

/* 시연 */
.tour{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:25;width:min(720px,calc(100vw - 32px));background:rgba(255,255,255,.97);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--float);padding:16px 20px;display:none}
.tour.on{display:block}
.tour .k{font-size:12px;color:#8A4B1E;font-weight:600}
.tour h3{margin:4px 0 6px;font-size:20px;letter-spacing:-.01em}
.tour p{margin:0;font-size:14.5px;line-height:1.65;color:var(--tx)}
.tour .tbig{font-size:22px;font-weight:800;letter-spacing:-.01em;color:#8A3E14}
body.dark .tour .tbig{color:#FFB074}
.tour .tl{font-size:13px;color:var(--tx-2);margin-left:4px}
.tour .tlist{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.tour .tlist li{margin:1px 0}
.tour .tlist b{color:var(--tx)}
@media (max-width:860px){.tour .tbig{font-size:18px}.tour .tlist{font-size:13px}}
.tour .bar{height:3px;background:#ECE9E1;border-radius:2px;margin-top:12px;overflow:hidden}
.tour .bar i{display:block;height:100%;width:0;background:var(--pt)}
.tour .nav{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.tour .nav button{height:30px;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:0 10px;font-size:12.5px;font-weight:600}
body.touring .panel,body.touring .ctl-r,body.touring .ctl-ind,body.touring .timeline,body.touring .legend{opacity:0;pointer-events:none}
body.touring #map{left:0}
.panel,.ctl-r,.ctl-ind,.timeline,.legend{transition:opacity .3s}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,26,22,.35);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:14px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px;box-shadow:var(--float)}
.modal h3{margin:0 0 12px;font-size:19px}
.modal h4{font-size:14px;margin:18px 0 6px}
.modal li,.modal p{font-size:13.5px;line-height:1.7}
.modal ul{padding-left:18px;margin:0}
.modal a{color:var(--pt)}
.modal .x{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--tx-2)}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;font-size:14px;color:var(--tx-2);transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}

.maplibregl-ctrl-attrib{font-size:10.5px}
.maplibregl-ctrl-bottom-right{bottom:88px}

/* ---------- 모바일 ---------- */
@media (max-width:860px){
  :root{--top:52px}
  .top{gap:10px;padding:0 10px 0 12px}
  .brand{font-size:16px}
  .kpis{display:none}
  .ref{display:none}
  #map{left:0;bottom:0}
  .panel{top:auto;left:0;right:0;width:auto;height:44vh;border-right:0;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);transition:height .25s ease;z-index:15}
  .panel.full{height:calc(100vh - var(--top) - 8px);height:calc(100dvh - var(--top) - 8px)}
  .panel.min{height:118px}
  .sheet-handle{display:block;border:0;background:none;width:100%;height:28px;flex:none;padding:0;position:relative}
  .sheet-handle::after{top:12px!important}
  .seg button{min-height:40px;padding:0 12px}
  .two button{height:40px}
  .ptab{min-height:44px}
  .tbtn{height:40px}
  .tour .nav{position:static;margin-bottom:8px}
  .tour .nav button{height:40px;flex:1}
  .intro{height:auto}
  .intro img{display:none}
  .intro p{position:static;background:none;padding:12px 0 0;margin:0 16px}
  .lg-lab{display:none}
  .sheet-handle::after{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;border-radius:2px;background:var(--line-2);transform:translateX(-50%)}
  .ptabs{padding-top:0}
  .pbody{padding:14px 16px 40px}
  .intro{margin:-14px -16px 14px;height:120px}
  .ctl-ind{left:10px;right:10px;top:calc(var(--top) + 8px)}
  .ctl-r{top:auto;bottom:calc(44vh + 10px);right:10px;width:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
  .ctl-r h4,.ctl-r .tg,.ctl-r .kleg,.ctl-r .tbtn{display:none}
  .ctl-r .three{grid-template-columns:1fr;width:58px}
  .ctl-r .three button{font-size:12px;padding:6px 0;height:36px}
  .ctl-r .row2{display:none}
  .readme{display:none}
  .gl-grid b{font-size:20px}
  .legend{left:10px;top:calc(var(--top) + 112px);bottom:auto;width:200px;padding:7px 9px}
  .legend .t small{display:block;margin:1px 0 0}
  .legend .foot{display:none}
  .timeline{display:none}
  .inddd .menu{width:calc(100vw - 20px);position:fixed;left:10px;top:calc(var(--top) + 52px)}
  body.sheet-min .ctl-r{bottom:128px}
  body.sheet-full .ctl-r,body.sheet-full .legend{opacity:0;pointer-events:none}
  .tour{bottom:12px;padding:14px 16px}
  .tour h3{font-size:17px;padding-right:0}
  .top-r .tbtn .t-txt{display:none}
  .maplibregl-ctrl-bottom-right{bottom:calc(44vh + 64px)}
  body.sheet-min .maplibregl-ctrl-bottom-right{bottom:180px}
  body.sheet-full .maplibregl-ctrl-bottom-right{opacity:0}
  .maplibregl-ctrl-attrib{max-width:calc(100vw - 90px)}
  .maplibregl-ctrl-group{display:none}
}
/* 유리 패널: 지도가 비쳐 보이게 */
.ctl-r,.legend,.timeline,.readme,.seg,.inddd>button,.tour{background:rgba(255,255,255,.8)!important;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.timeline{border-radius:16px}
.themebtn{width:34px;padding:0;justify-content:center}
.themebtn .icon-sun{display:none}
body.dark .themebtn .icon-moon{display:none}
body.dark .themebtn .icon-sun{display:block}
#btnTheme[aria-pressed=true]{color:#23A6A6;border-color:rgba(35,166,166,.5);background:rgba(35,166,166,.09)}
body.dark #btnTheme[aria-pressed=true]{color:#A5F2E8;border-color:rgba(120,184,210,.5);background:rgba(120,184,210,.12)}
body.dark .map-start{background:radial-gradient(circle at 100% 0%,rgba(72,215,199,.28),transparent 42%),linear-gradient(132deg,#102D48 0%,#14566B 58%,#147F7A 100%);border-color:rgba(98,201,201,.5);color:#F5FCFF}
.site-foot{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border-top:1px solid var(--line);background:var(--card);font-size:11.5px;color:var(--tx-3)}
.site-foot a{display:inline-flex;align-items:center;gap:6px;color:var(--pt);font-weight:700;text-decoration:none}
.site-foot a:hover{text-decoration:underline}
body.dark .site-foot{background:rgba(14,19,25,.96)}

body.dark .menu,body.dark .modal .box{background:#121820;color:var(--tx)}
body.dark .menu button:hover,body.dark .tg:hover,body.dark .rank li:hover,body.dark .tbl tr:hover td,body.dark .gl-grid button:hover{background:rgba(255,255,255,.06)}

body.dark .tl-bar i{background:rgba(255,255,255,.18)}
body.dark .tl-bar[aria-pressed=true] i{background:var(--pt);box-shadow:0 0 12px rgba(61,220,151,.7)}

body.dark .cmp .track::before{background:rgba(255,255,255,.14)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:60;background:rgba(20,24,22,.94);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.risk{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-top:12px}
.risk.hi{border-color:#E8391C;background:#FFF6F3}
.risk .h{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.risk .lvl{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F1EFE9;color:var(--tx-2)}
.risk.mid .lvl{background:#FBF0DE;color:#8A4B1E}
.risk.hi .lvl{background:#E8391C;color:#fff}
.risk ul{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px;line-height:1.7}
.risk li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#E8391C;margin-right:8px;vertical-align:1px}

.risk p{font-size:12px;color:var(--tx-3);margin:6px 0 0}

body.dark .risk.hi{background:rgba(232,57,28,.1)}
body.dark .risk .lvl{background:rgba(255,255,255,.08)}
body.dark .toast{background:#E9EEF2;color:#0B0F14}
/* 공시 뷰어 */
.dv{position:fixed;inset:0;z-index:45;background:rgba(20,26,22,.38);display:none;align-items:stretch;justify-content:flex-end}
.dv.on{display:flex}
.dv .box{width:min(760px,100%);height:100%;background:var(--card);display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;box-shadow:var(--float)}
.dv .hd{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dv .hd h3{margin:0;font-size:17px;flex:1;min-width:0}
.dv .hd h3 small{display:block;font-size:12px;color:var(--tx-2);font-weight:500;margin-top:2px}
.dv .hd input{height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;width:180px;background:var(--card);color:var(--tx)}
.dv .hd .x{border:0;background:none;font-size:24px;line-height:1;color:var(--tx-2);padding:4px 6px}
.dv nav{border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
.dv nav h5{font-size:11.5px;color:var(--tx-3);margin:12px 8px 4px;font-weight:600;letter-spacing:.02em}
.dv nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13.5px;color:var(--tx)}
.dv nav button:hover{background:#F4F2EC}
.dv nav button[aria-current=true]{background:var(--pt-soft);color:var(--pt);font-weight:700}
.dv main{overflow:auto;padding:6px 22px 40px;overscroll-behavior:contain}

/* 둘러보기 위 설명판 */
.ttop{display:none;position:fixed;top:calc(var(--top) + 12px);left:50%;transform:translateX(-50%);z-index:25;width:min(720px,calc(100vw - 32px));background:rgba(255,255,255,.9);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;font-size:13.5px;line-height:1.5;color:var(--tx);pointer-events:none}
.ttop.on{display:block}
.ttop .r1{display:flex;align-items:center;gap:6px;font-size:15.5px}
.ttop .r1 svg{color:var(--pt);flex:none}
.ttop .r1 span{font-size:12.5px;color:var(--tx-2);margin-left:2px}
.ttop .r2{margin-top:3px;color:var(--tx-2)}
.ttop .r2 b{color:var(--tx)}
.ttop .nr{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ttop .nr span{display:inline-flex;align-items:center;gap:4px;color:var(--tx);font-variant-numeric:tabular-nums}
.ttop .nr span.sm60{color:#B3261E;font-weight:600}
.ttop .nr i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ttop .r3{margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx-2)}
/* Cinematic flight tracker */
.flight-hud{display:none;position:fixed;top:calc(var(--top) + 14px);right:16px;width:196px;z-index:24;padding:11px 12px 10px;border:1px solid rgba(170,210,225,.32);border-radius:13px;background:rgba(7,18,27,.78);color:#E6F5FA;box-shadow:0 12px 34px rgba(0,12,22,.24);backdrop-filter:blur(12px) saturate(130%);-webkit-backdrop-filter:blur(12px) saturate(130%);pointer-events:none}
body.flight-tour .flight-hud{display:block;animation:hud-in .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes hud-in{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.flight-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em;color:#B9D8E2}
.flight-live{display:inline-flex;align-items:center;gap:5px;color:#9DF3D5}
.flight-live i{width:7px;height:7px;border-radius:50%;background:#64F0BB;box-shadow:0 0 10px #64F0BB;animation:flight-blink 1.5s ease-in-out infinite}
@keyframes flight-blink{50%{opacity:.35;box-shadow:0 0 2px #64F0BB}}
.flight-map{display:block;width:100%;height:94px;margin:5px 0 1px;overflow:visible}
.flight-grid{stroke:rgba(186,225,237,.11);stroke-width:.7;fill:none}
.flight-route{stroke:rgba(178,219,231,.45);stroke-width:1.7;stroke-dasharray:3 3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.flight-progress{stroke:#71E7D0;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(113,231,208,.8));transition:d .65s ease}
.flight-node{fill:#173744;stroke:#83C9D7;stroke-width:1.5;transition:fill .25s,stroke .25s}
.flight-node.done{fill:#64F0BB;stroke:#C7FFF0}.flight-node.active{fill:#FFF1A6;stroke:#FFFFFF;stroke-width:2.4;filter:drop-shadow(0 0 4px #FFE98A)}
.flight-drone{transition:transform .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px rgba(255,245,174,.75))}
.flight-drone .body{fill:#FFF0A3;stroke:#FFFFFF;stroke-width:.7}.flight-drone .arm{stroke:#FFF0A3;stroke-width:1.5;stroke-linecap:round}.flight-drone .rotor{fill:none;stroke:#FFFFFF;stroke-width:1.2;transform-origin:center;animation:rotor .16s linear infinite}
@keyframes rotor{to{transform:rotate(360deg)}}
.flight-foot{display:flex;align-items:baseline;justify-content:space-between;gap:6px;border-top:1px solid rgba(186,225,237,.18);padding-top:7px}
.flight-foot b{font-size:13px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flight-foot span{font-size:10.5px;color:#A9C9D4;white-space:nowrap}
.flight-phase{font-size:10.5px;color:#9DF3D5;margin-top:2px}
.drone-target{position:relative;width:58px;height:58px;pointer-events:none;color:#A8FFF0}
.drone-target:before,.drone-target:after{content:"";position:absolute;inset:8px;border:1px solid currentColor;border-radius:50%;box-shadow:0 0 12px rgba(123,255,235,.5)}
.drone-target:before{animation:target-ping 2.4s ease-out infinite}
.drone-target:after{inset:17px;border-style:dashed;animation:target-spin 18s linear infinite}
@keyframes target-ping{0%{transform:scale(.75);opacity:.95}100%{transform:scale(1.9);opacity:0}}
@keyframes target-spin{to{transform:rotate(360deg)}}
.drone-target i{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#EFFFFB;box-shadow:0 0 10px 4px rgba(106,255,220,.8);transform:translate(-50%,-50%)}
.drone-target b{position:absolute;left:50%;top:49px;transform:translateX(-50%);padding:2px 5px;border-radius:4px;background:rgba(4,20,28,.75);font:700 8px/1.2 system-ui,sans-serif;letter-spacing:.08em;white-space:nowrap;color:#B8FFF0}
body.dark .ttop{background:rgba(16,22,29,.8);border-color:rgba(255,255,255,.12)}

function barsSvg(vals, labels, { w = 360, h = 120, color = '#23704A', unit = '', predFrom = 99 } = {}) {

  const bw = (w - 8) / vals.length, pad = 18;
  return `<svg class="chart" viewBox="0 0 ${w} ${h + pad + 16}" width="100%" role="img" aria-label="${labels.map((l, i) => `${l} ${fmt(vals[i])}${unit}`).join(', ')}">
  <line x1="0" x2="${w}" y1="${h + pad}" y2="${h + pad}" stroke="#D6D1C4"/>
  <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#F3EFE6"/><rect width="2.2" height="5" fill="${color}" opacity=".55"/></pattern></defs>
  ${vals.map((v, i) => { const bh = v ? Math.max(2, (v / mx) * h) : 0; const x = 4 + i * bw + bw * 0.2; const pred = i >= predFrom; return `<g><title>${labels[i]}${pred ? ' 추정' : ''}: ${fmt(v)}${unit}</title><rect x="${x}" y="${h + pad - bh}" width="${bw * 0.6}" height="${bh}" rx="3" fill="${pred ? 'url(#hatch)' : predFrom < 99 && i === predFrom - 1 ? color : i === vals.length - 1 && predFrom === 99 ? color : '#CFC9BB'}"/><text x="${x + bw * 0.3}" y="${h + pad - bh - 5}" text-anchor="middle" font-size="${vals.length > 8 ? 9.5 : 11.5}" fill="#5D665F" font-weight="600">${v === null ? '–' : fmt(v)}</text><text x="${x + bw * 0.3}" y="${h + pad + 13}" text-anchor="middle" font-size="${vals.length > 8 ? 10 : 11.5}" fill="${pred ? '#8A918A' : '#5D665F'}">${labels[i]}</text></g>`; }).join('')}</svg>`;
}

function lib(url) { return (libs[url] ||= new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = url; sc.onload = ok; sc.onerror = () => no(new Error('라이브러리를 불러오지 못했습니다')); document.head.appendChild(sc); })); }

const fileBase = (s) => `${s.name}_전남광주교육지도_${new Date().toISOString().slice(0, 10)}`;
/* PDF: 보고서를 보이지 않는 창에 그려 그림으로 떠서 A4 PDF로(한글 글꼴 걱정 없음) */
async function reportPdf(s, btn) {
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'PDF 만드는 중…';
  try {
    const [img, j] = await Promise.all([mapSnapshot(), discFile(s)]);
    await Promise.all([lib('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'), lib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')]);
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0';
    document.body.appendChild(fr);
    fr.srcdoc = reportHtml(s, img, false, discSummary(j)).replace('@media screen{body{max-width:820px;margin:20px auto;padding:0 16px}}', 'body{padding:28px 32px;width:794px}');
    await new Promise((r) => (fr.onload = r));
    await fr.contentDocument.fonts.ready; await new Promise((r) => setTimeout(r, 300));

    fr.remove();
    const pdf = new jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const pw = 210, ph = 297, h = (cv.height * pw) / cv.width;
    const data = cv.toDataURL('image/jpeg', 0.92);

    for (let y = 0; y < h - 8; y += ph) { if (y) pdf.addPage(); pdf.addImage(data, 'JPEG', 0, -y, pw, h); }

}

/* ---------- 학생 감소 신호 ----------
   통계·추정에서 확인되는 숫자만 모은다(학교의 앞날을 판단하지 않음) */
function riskOf(s) {
  if (s.kind === '특수학교' || s.kind === '고등학교') {
    const out = [];
    if (s.kind === '고등학교') { if ((s.stu[4] || 0) <= 60) out.push('지금 학생 60명 이하'); if (s.entrants === 0) out.push('올해 신입생 0명'); }
    return out;
  }
  const out = [];
  if ((s.stu[4] || 0) <= 60) out.push(`지금 학생 ${fmt(s.stu[4])}명(60명 이하)`);
  if (s.entrants === 0) out.push('2026학년도 신입생 0명');
  if (s.pj) {
    if (s.pj.below60) out.push(`${s.pj.below60}년 60명 아래로 추정`);
    const c31 = s.stu[4] ? (s.pj.stu[4] / s.stu[4] - 1) * 100 : null;
    if (c31 !== null && c31 <= -30) out.push(`2031년까지 ${Math.round(-c31)}% 줄어들 추정`);
    if (s.pj.stu[4] <= 10) out.push(`2031년 약 ${fmt(s.pj.stu[4])}명(10명 이하) 추정`);
    if (s.kind === '초등학교' && s.pj.g1.slice(0, 5).some((v) => v === 0)) out.push(`${2027 + s.pj.g1.findIndex((v) => v === 0)}년 입학생 0명 추정`);
    if (s.pj.kids05 !== undefined && s.pj.kids05 < 12) out.push(`통학구역에 사는 0~5세 약 ${fmt(s.pj.kids05)}명`);
  }
  return out;
}
const riskLevel = (n) => (n >= 3 ? 'hi' : n >= 1 ? 'mid' : 'lo');
function riskHtml(s) {
  const r = riskOf(s), lv = riskLevel(r.length);
  const label = { hi: '여러 개', mid: '있음', lo: '없음' }[lv];
  return `<div class="risk ${lv}"><div class="h">학생 감소 신호 <span class="lvl">${r.length}개</span></div>
  <ul>${r.length ? r.map((x) => `<li>${esc(x)}</li>`).join('') : '<li class="ok">통계로 보이는 감소 신호가 없습니다</li>'}</ul>
  <p>공식 통계와 단순 추정에서 뽑은 참고 숫자입니다. 학교 운영에 관한 판단이나 계획이 아닙니다.</p></div>`;
}

/* ---------- 링크 공유: 지금 화면 그대로 ---------- */
function shareUrl() {
  syncHash();

  const p = new URLSearchParams(location.hash.slice(1));
  p.set('c', [c.lng.toFixed(4), c.lat.toFixed(4), map.getZoom().toFixed(2), Math.round(map.getPitch()), Math.round(map.getBearing())].join(','));
  if (S.view !== 'bar') p.set('v', S.view);

  if (!S.sat) p.set('b', 'm');

}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
async function share(title) {
  const url = shareUrl();
  const text = title || (S.school !== null ? D.schools[S.school].name + ' — 전남광주교육지도' : S.story ? S.story.q : '전남광주교육지도');

/* ---------- 기울여 보기: 휴대폰 방향으로 방위·기울기 ---------- */
const GY = { on: false, base: null, raf: 0, tgt: null };
function gyroHandler(e) {
  if (e.beta === null) return;
  if (!GY.base) GY.base = { b: e.beta, g: e.gamma, bearing: map.getBearing() };
  GY.tgt = { bearing: GY.base.bearing + (e.gamma - GY.base.g) * 1.6, pitch: Math.max(0, Math.min(72, 45 + (e.beta - GY.base.b) * 1.1)) };
}
function gyroLoop() {
  if (!GY.on) return;
  if (GY.tgt && !map.isMoving()) {
    const b = map.getBearing(), p = map.getPitch();
    map.jumpTo({ bearing: b + (GY.tgt.bearing - b) * 0.15, pitch: p + (GY.tgt.pitch - p) * 0.15 });
  }
  GY.raf = requestAnimationFrame(gyroLoop);
}
async function toggleGyro() {
  if (GY.on) { GY.on = false; window.removeEventListener('deviceorientation', gyroHandler); cancelAnimationFrame(GY.raf); $('#btnGyro').setAttribute('aria-pressed', 'false'); return; }
  try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') { toast('움직임 사용을 허용해야 합니다.'); return; } } } catch (e) {}
  if (typeof DeviceOrientationEvent === 'undefined') { toast('이 기기는 기울기 센서를 지원하지 않습니다.'); return; }
  if (S.view === '2d') { S.view = 'bar'; applyView(); }
  GY.on = true; GY.base = null; GY.tgt = null;
  window.addEventListener('deviceorientation', gyroHandler);
  $('#btnGyro').setAttribute('aria-pressed', 'true'); buzz();
  toast('휴대폰을 좌우·앞뒤로 기울여 보세요');
  gyroLoop();
}
const buzz = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- 모바일 시트 ---------- */
function openSheet() { if (!MOBILE) return; const p = $('#panel'); p.classList.remove('min'); document.body.classList.remove('sheet-min'); }
// 손가락으로 밀기: 위로 → 한 단계 크게, 아래로 → 한 단계 작게
(() => {
  let y0 = null;
  const zones = ['#handle', '.ptabs', '#peek'];
  const setState = (dir) => {
    const p = $('#panel'), st = p.classList.contains('full') ? 2 : p.classList.contains('min') ? 0 : 1;
    const n = Math.max(0, Math.min(2, st + dir));
    p.classList.toggle('full', n === 2); p.classList.toggle('min', n === 0);
    document.body.classList.toggle('sheet-min', n === 0); document.body.classList.toggle('sheet-full', n === 2);
  };
  zones.forEach((z) => { const el = $(z); if (!el) return;
    el.addEventListener('touchstart', (e) => { y0 = e.touches[0].clientY; }, { passive: true });
    el.addEventListener('touchend', (e) => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (Math.abs(dy) > 28) { setState(dy < 0 ? 1 : -1); e.preventDefault(); } }, { passive: false });
  });
  $('#peek').addEventListener('click', () => setState(1));
})();
$('#handle').addEventListener('click', () => {
  const p = $('#panel');
  if (p.classList.contains('full')) { p.classList.remove('full'); p.classList.add('min'); }
  else if (p.classList.contains('min')) { p.classList.remove('min'); }
  else p.classList.add('full');
  document.body.classList.toggle('sheet-min', p.classList.contains('min'));
  document.body.classList.toggle('sheet-full', p.classList.contains('full'));
});

  ${li(H.hak, `초등학구 색칠: 학구도 초등학교통학구역 ${fmt(Object.keys(D.hak).length)}곳(공공데이터포털, 2025. 9. 22. 기준). 학구 안 0~5세는 읍면동 주민등록 인구를 겹치는 면적 비율로 나눈 값입니다. 원자료에 학구가 그려지지 않은 빈 곳이 있어(광주 풍암·동림·일곡동 등) 지역 0~5세의 약 90%만 학구에 담기므로, 일부 학구의 아이 수는 실제보다 적게 보일 수 있습니다.`)}
  ${li(H.hak, '통학구역: 학구도안내시스템 경계에서 학교 위치가 들어가는 구역을 찾았습니다. 공동통학구역은 여러 학교가 함께 씁니다. 법적 효력은 없습니다.')}
  ${li(H.pj, `5년 뒤 추정(초·중·고): 초등학교는 학구 경계와 행정동이 겹치는 면적 비율로 학구 안 나이별 인구를 추정하고, 2026년 실제 1학년 ÷ 같은 출생 연도 인구를 그 학교로 오는 비율로 삼았습니다(비율법이라 학구 인구가 적게 잡혀도 비율이 그만큼 커져 결과는 상쇄됩니다). 중학교는 ${H.zm ? '<b>전남광주통합특별시교육청 「중학교 학교군 및 중학구 고시(안)」(2026. 10. 1. 행정예고, 2027학년도 적용 예정)의 초·중학교 연결표</b>에서 같은 학교군·중학구에 속한 초등학교 6학년' : '같은 시군구 초등학교 6학년'} 추정에서 이어 계산했습니다(연결표에 없는 일부 학교는 학구 경계나 같은 시군구 흐름으로 대신했고, 고시의 "희망하면 다른 학교군으로 진학할 수 있다" 같은 예외는 반영하지 않았습니다). 고등학교는 2026년 실제 고1 수에 중3 학생 수의 변화율을 적용한 규모 시나리오로, 입학 가능성·배정 예측으로 쓸 수 없습니다. 학교 신설·재배치와 앞으로의 전입·전출은 반영하지 않은 단순 추정입니다.`)}
  ${li(H.alt, '해발 고도: AWS Terrain Tiles(z12) 지형 값. 지형 보기에서는 산 높이를 실제의 2.8배로 키워 보여 줍니다.')}
  ${li(!!VWORLD_KEY, "건물 3D: 크게 확대하면 브이월드 오픈API(국토교통부 도로명주소건물)에서 화면 둘레 건물만 그때그때 불러와 지상층수 × 3.3m 높이로 세웁니다(저장하지 않음).")}
  <li>Wee센터: 각 교육지원청이 운영하는 센터를 시군구 카드에 표시했습니다(광주 3곳·전남 22곳, 위치·상담 인력은 아직 담지 않음).</li>
  <li>인구감소지역: 강진·고흥·곡성·구례·담양·보성·신안·영광·영암·완도·장성·장흥·진도·함평·해남·화순(16곳), 관심지역: 광주 동구.</li></ul>
  <h4>한계</h4><ul>
  <li>폐교 재산은 표준데이터에 좌표가 없어 읍면 대표점 둘레에 놓았습니다. 같은 폐교가 두 기관 이름(전라남도교육청·전남광주통합특별시교육청)으로 두 번 실린 것은 하나만 남겼습니다.</li>
  <li>학교 위치는 한국교육시설안전원 자료를 썼습니다.</li>
  <li>KESS 통계는 공표 후 바뀌지 않는 조사 자료라 학교알리미 공시 숫자와 조금 다를 수 있습니다.</li></ul>
  <p class="small muted">자료 만든 날: ${esc(m.builtAt.slice(0, 10))}</p>`;
}

/* =========================================================
   주소 공유(해시)
   ========================================================= */
function syncHash() {
  if (touring) return;
  const p = new URLSearchParams();
  p.set('i', S.ind); if (S.level !== 'sigun') p.set('lv', S.level); if (S.kind !== 'all') p.set('k', S.kind); if (S.yi !== 4) p.set('y', YEARS[S.yi]);
  if (S.school !== null) p.set('s', D.schools[S.school].id || D.schools[S.school].name);
  else if (S.sigun) p.set('sg', S.sigun);
  else if (S.story) p.set('q', S.story.id);
  history.replaceState(null, '', '#' + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('i') && IND[p.get('i')] && !(p.get('i') === 'change' && [...p.keys()].length === 1)) S.ind = p.get('i');
  if (p.get('lv')) S.level = p.get('lv');
  if (p.get('k') && KIND_KEYS.includes(p.get('k'))) S.kind = p.get('k');
  if (p.get('y')) { const y = YEARS.indexOf(+p.get('y')); if (y >= 0) S.yi = y; }
  if (p.get('fy')) { const y = FYEARS.indexOf(+p.get('fy')); if (y >= 0) S.fy = y; }
  if (['bar', '3d', '2d'].includes(p.get('v'))) S.view = p.get('v');
  if (p.get('t') === 'd') { DARK = true; document.body.classList.add('dark'); }
  if (p.get('b') === 'm') S.sat = false;
  return p;
}

function setLay(on) { document.body.classList.toggle('lay-open', on); const b = $('#btnLay'); if (b) b.setAttribute('aria-expanded', on); }
/* =========================================================
   이벤트 연결
   ========================================================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, li[data-sg], li[data-emd], li[data-hak], tr[data-sg], tr[data-kind]');
  if (!t || !t.closest('#inddd')) { $('#inddd').classList.remove('open'); document.body.classList.remove('menu-open'); }
  if (!e.target.closest('#ctlR') && !(t && t.id === 'btnLay')) setLay(false);
  if (t && t.id === 'dClose') { $('#inddd').classList.remove('open'); document.body.classList.remove('menu-open'); return; }
  if (t && t.id === 'btnLay') { setLay(!document.body.classList.contains('lay-open')); return; }
  if (!t) return;
  const d = t.dataset;
  if (t.id === 'indBtn') { setLay(false); $('#inddd').classList.toggle('open'); document.body.classList.toggle('menu-open', $('#inddd').classList.contains('open')); return; }
  if (d.ind) { S.ind = d.ind; if (!IND[S.ind].lv.includes(S.level)) S.level = IND[S.ind].lv[0]; $('#inddd').classList.remove('open'); document.body.classList.remove('menu-open'); paint(); if (S.story) renderStory(); return; }
  if (d.lv && !t.disabled) { if (!IND[S.ind].lv.includes(d.lv)) S.ind = { sigun: 'change', emd: 'k05', hak: 'hakChg' }[d.lv]; S.level = d.lv; map.setFilter('hak-hover', ['==', ['get', 'code'], '']); S.sigun = null; S.emd = null; map.setFilter('sel-line', ['==', ['get', 'sigun'], '']); map.setFilter('emd-hover', ['==', ['get', 'code'], '']); paint(); renderPanel(); return; }
  if (d.k) { S.kind = d.k; paint(); applySchoolFilter(); if (S.story || S.tab === 'r') renderPanel(); return; }
  if (d.kind) { S.kind = d.kind; paint(); applySchoolFilter(); return; }
  if (d.v) { const was = S.view; S.view = d.v; applyView(); if (d.v === '3d' && was !== '3d' && S.school === null && !S.story) flyMountain(); return; }
  if (d.l === 'sat' || t.id === 'btnSat') { S.sat = !S.sat; try { localStorage.setItem('gbSat', S.sat ? '1' : '0'); } catch (e) {} applyBase(); applyView(true); return; }
  if (d.l) { S.layers[d.l] = !S.layers[d.l]; if (d.l === 'zoneM' && S.layers.zoneM) showAllMiddleZones(); applyView(); applySchoolFilter(); renderLegend(); return; }
  if (d.y !== undefined && t.classList.contains('tl-bar')) { stopPlay(); setYear(+d.y); return; }
  if (d.fy !== undefined && t.classList.contains('tl-bar')) { stopPlay(); setFutureYear(+d.fy); return; }
  if (d.msort) { S.msort = d.msort; renderPanel(); return; }
  if (d.tab) { setTab(d.tab); return; }
  if (d.story) { openStory(d.story); return; }
  if (d.sim !== undefined) { runSim(+d.sim); return; }
  if (d.sch !== undefined) { stopSim(); openSchool(+d.sch); return; }
  if (d.schname) { const s = D.schools.find((x) => x.name === d.schname && (!d.schsg || x.sigun === d.schsg)); if (s) openSchool(s.i); return; }
  if (d.closed !== undefined) { openClosed(+d.closed); return; }
  if (d.sg) { openSigun(d.sg); return; }
  if (d.hak) { const z = D.hak[d.hak]; if (z && z.sch.length) openSchool([...z.sch].sort((a, b) => (b.stu[4] || 0) - (a.stu[4] || 0))[0].i); return; }
  if (d.emd) { if (S.level !== 'emd' && !IND[S.ind].lv.includes('emd')) S.ind = 'nearM'; S.level = 'emd'; paint(); openEmd(d.emd); return; }
  if (d.act === 'qlist') { S.story = null; setFilter(null); S.layers.closed = false; applyView(true); renderPanel(); syncHash(); return; }
  if (d.act === 'close') { // 한 단계씩 뒤로: 학교 → 폐교 → 읍면동 → 시군
    if (S.school !== null) { S.school = null; selectSchool(-1); stopSim(); }
    else if (S.closedSel !== null && S.closedSel !== undefined) S.closedSel = null;
    else if (S.emd) { S.emd = null; map.setFilter('emd-hover', ['==', ['get', 'code'], '']); }
    else if (S.sigun) { S.sigun = null; map.setFilter('sel-line', ['==', ['get', 'sigun'], '']); }
    renderPanel(); syncHash(); return; }
  if (d.act === 'more') { SQ.n += 100; renderSearch(); return; }
  if (d.act === 'sclear') { Object.assign(SQ, { q: '', sg: '', k: '', cond: '', n: 60 }); pbody.innerHTML = ''; renderSearch(); return; }
  if (d.act === 'about-x') { $('#about').classList.remove('on'); return; }
  if (t.id === 'play') { togglePlay(); return; }
  if (t.id === 'btnReset') { goHome(); return; }
  if (t.id === 'btnUlleung') { map.flyTo({ center: [126.2, 34.75], zoom: 8.6, pitch: pitched() ? 50 : 0, bearing: 0, duration: 1800 }); return; }
  if (t.id === 'home') { stopTour(); setTab('s'); S.ind = 'nearE'; S.level = 'emd'; S.kind = 'all'; S.yi = 4; setFilter(null); S.layers.closed = false; S.layers.bj = false; applyView(true); paint(); map.getSource('sch-col').setData(schoolColumns()); map.getSource('sch-pt').setData(schoolPoints()); goHome(); return; }
  if (t.id === 'simStop') { stopSim(); return; }
  if (t.id === 'btnTour') { touring ? stopTour() : openPick(); return; }
  if (d.brief) { startBrief(d.brief); return; }
  if (d.act === 'bp-x') { closePick(); return; }
  if (d.act === 'bp-all') { closePick(); startTour(); return; }
  if (d.act === 'brief') { const sg = t.dataset.brsg || (S.school !== null ? D.schools[S.school].sigun : S.sigun); if (sg) startBrief(sg); return; }
  if (d.act === 'br-again' && BR) { tourIdx = 0; tourStep(); return; }
  if (d.act === 'br-pick') { stopTour(); openPick(); return; }
  if (d.act === 'br-link' && BR) { const u = location.origin + location.pathname + '#br=' + encodeURIComponent(BR.sg); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('브리핑 링크를 복사했습니다'), () => prompt('이 주소를 복사하세요', u)); return; }
  if (d.act === 'br-detail' && BR) { const sg = BR.sg; stopTour(); openSigun(sg); return; }
  if (t.id === 'tStop') { stopTour(); return; }
  if (t.id === 'tNext') { tourIdx = (tourIdx + 1) % tourLen(); tourStep(); return; }
  if (t.id === 'tPrev') { tourIdx = (tourIdx - 1 + tourLen()) % tourLen(); tourStep(); return; }
  if (t.id === 'btnTheme' || t.id === 'btnTheme2') { setTheme(!DARK); $('#btnTheme2').setAttribute('aria-pressed', DARK); return; }
  if (d.dv !== undefined) { openDV(+d.dv); return; }
  if (d.act === 'dv-x') { closeDV(); return; }
  if (d.act === 'report') { schoolReport(D.schools[S.school]); return; }
  if (d.act === 'pdf') { reportPdf(D.schools[S.school], t); return; }
  if (d.act === 'hwpx') { reportHwpx(D.schools[S.school], t); return; }
  if (t.id === 'btnGyro') { toggleGyro(); return; }
  if (t.id === 'btnShare' || d.act === 'share') { share(); return; }
  if (t.id === 'btnAbout') { renderAbout(); $('#about').classList.add('on'); return; }
});
$('#bpick').addEventListener('click', (e) => { if (e.target.id === 'bpick') closePick(); });
$('#about').addEventListener('click', (e) => { if (e.target.id === 'about') $('#about').classList.remove('on'); });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('li[data-sg], li[data-emd], tr[data-sg], tr[data-kind]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && $('#dv').classList.contains('on')) { closeDV(); return; }
  if (e.key === 'Escape' && $('#bpick').classList.contains('on')) { closePick(); return; }
  if (e.key === 'Escape') { if ($('#about').classList.contains('on')) $('#about').classList.remove('on'); else if (touring) stopTour(); else $('#inddd').classList.remove('open'); }
  if (touring && e.key === 'ArrowRight') { tourIdx = (tourIdx + 1) % tourLen(); tourStep(); }
  if (touring && e.key === 'ArrowLeft') { tourIdx = (tourIdx - 1 + tourLen()) % tourLen(); tourStep(); }
});

/* ---------- 시작 ---------- */
let DATA_READY = null;
(async () => {
  DATA_READY = load();
  const p = readHash();
  initMap();
  try { await DATA_READY; } catch (e) { $('#loading').textContent = '자료를 불러오지 못했습니다. 새로고침해 주세요.'; return; }
  // 지도 레이어가 준비되면(setupLayers 끝) 한 번 실행 — 'load' 이벤트 순서에 기대지 않는다
  routeInitial = () => {
    if (p.get('s') || p.get('sg') || p.get('q') || p.get('br')) S.introPending = false;
    if (p.get('br') && D.stats.sigun[p.get('br')]) { renderPanel(); setTimeout(() => startBrief(p.get('br')), 400); return; }
    const cam = (p.get('c') || '').split(',').map(Number);
    const hasCam = cam.length === 5 && cam.every(isFinite);
    if (p.get('s')) { const s = D.schools.find((x) => x.id === p.get('s') || x.name === p.get('s')); if (s) { setTab('s'); openSchool(s.i, !hasCam); } }
    else if (p.get('sg') && D.stats.sigun[p.get('sg')]) openSigun(p.get('sg'));
    else if (p.get('q')) { openStory(p.get('q'), !hasCam); if (p.get('fy') && isFuture()) setFutureYear(FYEARS.indexOf(+p.get('fy')), false); }
    else renderPanel();
    if (hasCam) { map.stop(); map.jumpTo({ center: [cam[0], cam[1]], zoom: cam[2], pitch: cam[3], bearing: cam[4] }); }
  };
  if (layersReady) routeInitial();
  if (MOBILE) { $('#panel').classList.add('min'); document.body.classList.add('sheet-min'); }
})();
</script>
